---
# __step_ca_unit is only defined once the systemd unit has been installed, so the
# handler is skipped when only install.yml ran, e.g. via tasks_from.
- name: Restart step-ca
  ansible.builtin.systemd_service:
    name: step-ca
    state: restarted
    daemon_reload: true
  when:
    - __step_ca_unit is defined
    - step_ca_service_state == 'started'
