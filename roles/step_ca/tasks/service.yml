---
- name: Install the systemd unit
  ansible.builtin.template:
    src: step-ca.service.j2
    dest: /etc/systemd/system/step-ca.service
    owner: root
    group: root
    mode: "0644"
  register: __step_ca_unit
  notify: Restart step-ca

- name: Enable and start step-ca
  ansible.builtin.systemd_service:
    name: step-ca
    enabled: "{{ step_ca_service_enabled }}"
    state: "{{ step_ca_service_state }}"
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for step-ca to become healthy
  ansible.builtin.uri:
    url: "{{ __step_ca_url }}/health"
    ca_path: "{{ __step_ca_root_cert_path }}"
    return_content: true
  register: __step_ca_health
  until: __step_ca_health.json.status | default('') == 'ok'
  retries: "{{ step_ca_health_check_retries }}"
  delay: "{{ step_ca_health_check_delay }}"
  when:
    - step_ca_health_check
    - step_ca_service_state == 'started'
