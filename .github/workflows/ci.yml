---
name: CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ansible-lint

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ansible-galaxy collection build --output-path build/

  molecule:
    name: molecule (${{ matrix.distro }}, ${{ matrix.backend }}, ${{ matrix.runner }})
    needs: lint
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        distro: [debian12, debian13]
        backend: [docker, podman]
    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      MOLECULE_CONTAINERS_BACKEND: ${{ matrix.backend }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      # Molecule installs the collection under test from the working tree before each run.
      - run: uv run molecule test
