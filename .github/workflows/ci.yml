---
name: CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ansible-lint

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ansible-galaxy collection build --output-path build/

  molecule:
    name: molecule (${{ matrix.distro }}, ${{ matrix.scenario }}, ${{ matrix.runner }})
    needs: lint
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        distro: [debian12, debian13]
        scenario: [default, podman]
    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      # Rootless Podman cannot reliably run the privileged systemd test container on the
      # runners, so Molecule runs Podman as root through a wrapper.
      - name: Run Podman as root
        if: matrix.scenario == 'podman'
        run: |
          printf '#!/bin/sh\nexec sudo podman "$@"\n' | sudo tee /usr/local/bin/sudo-podman > /dev/null
          sudo chmod 0755 /usr/local/bin/sudo-podman
          echo "MOLECULE_PODMAN_EXECUTABLE=sudo-podman" >> "$GITHUB_ENV"
      # Molecule installs the collection under test from the working tree before each run.
      - run: uv run molecule test --scenario-name ${{ matrix.scenario }}
