---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
# Uses Podman if it is installed, otherwise Docker. Set MOLECULE_CONTAINERS_BACKEND
# to docker or podman to choose explicitly.
driver:
  name: containers
platforms:
  - name: step-ca
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ""
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
